[project]
name = "stock_radar"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# UP = 强制现代语法(与项目"Python>=3.11+类型注解"约束一致); B = 常见 bug 模式

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true  # akshare 等无 stub 的三方库
exclude = ["tests/"]           # 测试文件不强制注解
