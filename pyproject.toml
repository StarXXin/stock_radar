[project]
name = "stock_radar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "akshare",
    "openai",
    "python-dotenv",
    "requests",
    "pypdf",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-mock",
    "ruff",
    "mypy",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# UP = 强制现代语法(与项目"Python>=3.12+类型注解"约束一致); B = 常见 bug 模式

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true  # akshare 等无 stub 的三方库
exclude = ["tests/"]           # 测试文件不强制注解
